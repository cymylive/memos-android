name: Release Android APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  GO_VERSION: "1.26.2"
  NODE_VERSION: "24"
  PNPM_VERSION: "11.0.1"
  NDK_VERSION: "26.3.11579264"

permissions:
  contents: write

jobs:
  release-apk:
    name: Build and publish release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4.2.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build frontend SPA
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm release

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and SDK components
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools" "ndk;${{ env.NDK_VERSION }}"

      - name: Bind Go library to AAR
        env:
          ANDROID_NDK_HOME: "${{ env.ANDROID_SDK_ROOT }}/ndk/${{ env.NDK_VERSION }}"
        run: |
          gomobile init
          mkdir -p android/app/libs
          gomobile bind -target=android/arm64 -androidapi 26 -o android/app/libs/mobile.aar ./mobile

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Decode signing keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore

      - name: Build signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: "${{ github.workspace }}/android/app/release.keystore"
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          TAG=${GITHUB_REF_NAME}
          if [ -z "$TAG" ] || [ "$TAG" = "main" ]; then TAG="v0.31.0"; fi
          NOTES="OwnDiary 离线发行版（内置 Go 后端 + WebView）.
          - 安装后自动在本机 8081 端口启动服务，通知栏显示局域网访问地址
          - 支持局域网共享、备份/恢复（菜单内操作）
          - 图片预览支持缩放后拖动画布查看细节
          - 数据全部保存在本机应用目录，重启后需手动打开应用"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" --title "$TAG" --notes "$NOTES"
          fi