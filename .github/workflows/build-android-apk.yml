name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - "android/**"
      - "web/**"
      - ".github/workflows/build-android-apk.yml"

env:
  GO_VERSION: "1.26.2"
  NODE_VERSION: "24"
  PNPM_VERSION: "11.0.1"
  NDK_VERSION: "26.3.11579264"

jobs:
  build-apk:
    name: Build memos.apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4.2.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build frontend SPA
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm release

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and SDK components
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools" "ndk;${{ env.NDK_VERSION }}"

      - name: Bind Go library to AAR
        env:
          ANDROID_NDK_HOME: "${{ env.ANDROID_SDK_ROOT }}/ndk/${{ env.NDK_VERSION }}"
        run: |
          gomobile init
          mkdir -p android/app/libs
          gomobile bind -target=android/arm64 -androidapi 26 -o android/app/libs/mobile.aar ./mobile

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: memos-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error